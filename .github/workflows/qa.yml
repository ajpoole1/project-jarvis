name: Tom QA (reusable)

# Reusable workflow — called by qa-caller.yml (and future repo callers).
# Tom is a non-Claude model (Gemini) by design: see DEV_LOOP_REFERENCE §3, invariant 4.
# Fail-closed: if Tom errors, the check is red. Never green on outage.
#
# Secrets required (set in repo Actions secrets):
#   QA_MODEL_API_KEY       — Google AI Studio key for gemini-3.5-flash
#   DISCORD_DEVLOOP_WEBHOOK — Discord webhook URL for verdict notifications
#
# Branch protection: add 'qa / Tom QA' as a required check on main.

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      item_id:
        required: false
        type: string
        default: ""
      qa_min_diff_lines:
        required: false
        type: number
        default: 20
    secrets:
      QA_MODEL_API_KEY:
        required: true
      ANTHROPIC_API_KEY:
        required: false
      DISCORD_DEVLOOP_WEBHOOK:
        required: false

jobs:
  tom-qa:
    name: Tom QA
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Notify QA started
        env:
          DISCORD_DEVLOOP_WEBHOOK: ${{ secrets.DISCORD_DEVLOOP_WEBHOOK }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ITEM_ID: ${{ inputs.item_id }}
        run: |
          WEBHOOK="${DISCORD_DEVLOOP_WEBHOOK}"
          [ -z "$WEBHOOK" ] && exit 0
          ITEM="${ITEM_ID:-}"
          [ -n "$ITEM" ] && LABEL=" ($ITEM)" || LABEL=""
          QA_MSG="🔍 Tom is reviewing PR #${PR_NUMBER}${LABEL}."
          QA_MSG="$QA_MSG" DISCORD_WEBHOOK="$WEBHOOK" python3 -c '
          import json, os, urllib.request
          msg = os.environ["QA_MSG"]
          webhook = os.environ["DISCORD_WEBHOOK"]
          data = json.dumps({"content": msg}).encode()
          req = urllib.request.Request(webhook, data=data, headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req)
          ' 2>/dev/null || echo "Warning: QA-started notification failed" >&2

      - name: Compute diff
        id: diff
        run: |
          git fetch origin main
          # Capture full diff without piping to head — piping under bash -eo pipefail causes
          # SIGPIPE when git diff is still writing after head closes the read end (>40 KB diffs
          # would fail the step). Truncate in-process instead; append a note so Tom knows.
          FULL_DIFF=$(git diff origin/main...HEAD)
          if [ "${#FULL_DIFF}" -gt 40000 ]; then
            DIFF="${FULL_DIFF:0:40000}"$'\n\n[diff truncated at 40 000 bytes — full diff is '"${#FULL_DIFF}"' bytes]'
          else
            DIFF="$FULL_DIFF"
          fi
          echo "diff<<DIFF_EOF" >> "$GITHUB_OUTPUT"
          echo "$DIFF" >> "$GITHUB_OUTPUT"
          echo "DIFF_EOF" >> "$GITHUB_OUTPUT"

      - name: Load spec
        id: spec
        run: |
          ITEM_ID="${{ inputs.item_id }}"

          # Try to extract item_id from PR body if not passed directly
          if [ -z "$ITEM_ID" ]; then
            ITEM_ID=$(gh pr view ${{ inputs.pr_number }} --json body -q '.body' \
              | grep -oP '(?<=item-id: `)[\w-]+(?=`)' | head -1 || true)
          fi

          if [ -z "$ITEM_ID" ]; then
            echo "spec=none" >> "$GITHUB_OUTPUT"
            echo "item_id=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch spec from dev-queue branch
          git fetch origin dev-queue 2>/dev/null || true
          SPEC=$(git show "origin/dev-queue:knowledge/dev-notes/queue/$ITEM_ID.md" 2>/dev/null || echo "")

          echo "item_id=$ITEM_ID" >> "$GITHUB_OUTPUT"
          echo "spec<<SPEC_EOF" >> "$GITHUB_OUTPUT"
          echo "$SPEC" >> "$GITHUB_OUTPUT"
          echo "SPEC_EOF" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Load repo context
        id: context
        run: |
          CLAUDE_MD=$(cat CLAUDE.md 2>/dev/null | head -c 8000 || echo "(not found)")
          echo "claude_md<<CTX_EOF" >> "$GITHUB_OUTPUT"
          echo "$CLAUDE_MD" >> "$GITHUB_OUTPUT"
          echo "CTX_EOF" >> "$GITHUB_OUTPUT"

      - name: Run Tom (Gemini QA, Claude fallback)
        id: qa
        env:
          QA_MODEL_API_KEY: ${{ secrets.QA_MODEL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ inputs.pr_number }}
          DIFF: ${{ steps.diff.outputs.diff }}
          SPEC: ${{ steps.spec.outputs.spec }}
          ITEM_ID: ${{ steps.spec.outputs.item_id }}
          CLAUDE_MD: ${{ steps.context.outputs.claude_md }}
          QA_MIN_DIFF_LINES: ${{ inputs.qa_min_diff_lines }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, requests
          sys.path.insert(0, "scripts/dev-loop")
          from tom_qa_helpers import (
              count_changed_lines,
              make_skip_findings,
              parse_min_diff_lines,
              is_spec_only_diff,
              call_gemini_qa,
              call_claude_fallback,
          )

          # Read untrusted inputs from the environment, never by templating GitHub
          # Actions expressions into the script source. The diff can contain triple-quotes,
          # backslashes, em-dashes, etc. that would otherwise break (or inject into) it.
          diff = os.environ.get("DIFF", "")
          spec = os.environ.get("SPEC", "")
          item_id = os.environ.get("ITEM_ID", "none")
          claude_md = os.environ.get("CLAUDE_MD", "(not found)")

          # Nothing to review — the Compute-diff step produced an empty diff (e.g. a
          # docs-only PR with no skill/config/workflow changes). Legitimate PASS.
          # Fail-closed is reserved for Tom being unable to run (Gemini/parse errors →
          # exit 1 below); it is not triggered by an empty diff. No model call needed.
          if not diff.strip():
              findings = {
                  "spec_conformance": [],
                  "defects": [],
                  "architecture_notes": [
                      "No reviewable changes (diff is empty)."
                  ],
              }
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("findings<<FINDINGS_EOF\n")
                  f.write(json.dumps(findings, indent=2))
                  f.write("\nFINDINGS_EOF\n")
                  f.write("verdict=PASS\n")
                  f.write("blocking_count=0\n")
              print("No reviewable diff — PASS (nothing for Tom to review).")
              sys.exit(0)

          # Cost-gate: skip the model call when the diff is too small to justify it.
          # QA_MIN_DIFF_LINES is a workflow input (default 20); set it lower to review smaller PRs.
          min_diff_lines = parse_min_diff_lines(os.environ.get("QA_MIN_DIFF_LINES", ""))
          changed_lines = count_changed_lines(diff)
          if changed_lines < min_diff_lines:
              findings = make_skip_findings(changed_lines, min_diff_lines)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("findings<<FINDINGS_EOF\n")
                  f.write(json.dumps(findings, indent=2))
                  f.write("\nFINDINGS_EOF\n")
                  f.write("verdict=SKIP\n")
                  f.write("blocking_count=0\n")
              print(f"Trivial diff ({changed_lines} changed lines < threshold {min_diff_lines}) — QA skipped.")
              sys.exit(0)

          # Artifact-type detection: spec-only PRs are downgraded to advisory-only (no FAIL).
          artifact_type = "spec" if is_spec_only_diff(diff) else "code"

          api_key = os.environ["QA_MODEL_API_KEY"]

          system_prompt = """You are Tom, an adversarial code reviewer for the Jarvis project.
          You are NOT Claude — you are Gemini, a different model family. This decorrelation is intentional: you catch what the builder could not see.

          Your job: ASSUME there are issues and hunt for them. You are a skeptic, not a narrator. Do NOT summarize what the code does. Probe it for what can go wrong.

          Work through every item on this probe list for every review:
          1. Bugs and logic errors — wrong conditions, off-by-one, incorrect assumptions, silent data corruption
          2. Edge cases — empty input, boundary values, None/null, type mismatches, large inputs, zero-length collections
          3. Failure modes — crash mid-operation leaves partial state? what happens on retry? race conditions? SQLite write failures? flush interrupted?
          4. Security — injection risks, secrets exposure, unvalidated external input, privilege escalation
          5. Error handling — unhandled exceptions, silent failures, misleading error messages, missing rollback
          6. Missing or weak tests — are acceptance criteria covered? are assertions real or trivially true? are failure paths tested?
          7. Spec deviations — does the diff implement every acceptance criterion? does it omit anything the spec required?

          PASS rule: PASS only when you find nothing genuinely blocking. But every PASS must explain WHY you are confident:
          - State specifically what you checked from the probe list above
          - Give concrete advisory notes: edges worth watching, improvements to file, things not blocking today that could become issues
          - A bare "looks good", "clean implementation", or "well-structured" PASS is FORBIDDEN. Show your work.

          Return ONLY valid JSON matching this exact schema — no prose, no markdown fences:
          {
            "spec_conformance": [
              {"deviation": "string", "severity": "blocking|advisory"}
            ],
            "defects": [
              {"type": "bug|edge|security|missing-test|failure-mode", "location": "string", "description": "string", "severity": "blocking|advisory"}
            ],
            "architecture_notes": ["string"]
          }

          Severity grading — applies to every finding:
          - severity=blocking (defects): you MUST state a concrete trigger — the specific input, call path, or runtime condition that causes the failure. "Reachable via executing X" is not sufficient — name the exact how: what input, what state, what call sequence hits it. If you cannot articulate a concrete trigger, the finding is advisory, not blocking.
          - severity=blocking (spec conformance): an unmet acceptance criterion is ALWAYS blocking — no trigger demonstration required. If the PR spec states a required behavior or AC and the diff omits or violates it, grade it blocking conformance.
          - severity=advisory: theoretical edges where you cannot show a concrete trigger, defensive-hardening suggestions, extra tests, style nits, or anything you suspect but cannot demonstrate. Advisory findings need not state a trigger.
          - Verify-don't-assert: NEVER assert a syntax error, "bad substitution," "will crash," or runtime failure unless you can ground the claim in the repo's declared runtime (language, version, shell). When uncertain — e.g. a shell construct you cannot confirm is valid in the repo's exact shell version — raise an advisory "worth verifying" note, NOT a blocking defect. An unverified blocking assertion wastes a full build cycle.
          - Calibration — over-escalation: if a shell construct may be valid but you are not certain (e.g. `${!v:-}` in bash 5.2 is valid indirect expansion with default — do not block on this class of claim without verification), grade advisory. If a crash path exists but every call site passes validated input, grade advisory.
          - Calibration — over-escalation: if a function or symbol appears CALLED in the diff but its DEFINITION is not visible in the diff, do NOT block on "undefined" — the definition likely exists elsewhere in the file or module. Only block if the diff explicitly removes the definition while keeping calls.
          - Calibration — under-escalation: if a spec requires a fail-safe (e.g. "paginate until exhausted, never silently truncate") and the diff omits it, that is a blocking conformance failure regardless of how unlikely the path is in practice.

          Other rules:
          - architecture_notes MUST be non-empty: real critique, concrete suggestions, or your confidence rationale (what you checked and why you're satisfied)
          - If spec is 'none' or empty, review against repo conventions (CLAUDE.md) only
          - If there are no issues in a category, return an empty array for that key
          - Never return null — return [] for empty arrays
          - Keep descriptions concise: each string value must be 120 characters or shorter
          - Cap findings: at most 8 items per array; if more exist, include the most critical and add a single architecture_note summarising what was omitted
          """

          spec_instruction = (
              "Artifact type: spec (planning/knowledge document — NOT production code)\n"
              "Review for clarity and completeness only. Do not raise FAIL findings.\n"
              "All findings must use category \"advisory\". Output verdict must be \"pass\".\n\n"
          ) if artifact_type == "spec" else ""

          user_content = f"""{spec_instruction}## Spec (item: {item_id})
          {spec if spec and spec != 'none' else '(no spec provided — review against repo conventions)'}

          ## Repo conventions (CLAUDE.md excerpt)
          {claude_md}

          ## Diff (PR #{os.environ.get('PR_NUMBER', '?')})
          {diff}
          """

          # Primary reviewer: Gemini, with its full retry budget (see tom_qa_helpers).
          # PR #43 post-mortem: 3 consecutive 503s exhausted the old budget; increased to 5.
          reviewer = "gemini"
          findings = call_gemini_qa(api_key, system_prompt, user_content, requests)

          # Fallback (DEV_LOOP_REFERENCE §3 invariant #4, amended): only after Gemini's
          # full retry budget is exhausted, and only if a Claude key is configured. This
          # is a resilience valve for provider outages, not a routine reviewer path — the
          # verdict is always labeled so a Claude-reviewed PR is never mistaken for a
          # normal Tom (Gemini) pass.
          if findings is None:
              anthropic_key = os.environ.get("ANTHROPIC_API_KEY", "")
              if not anthropic_key:
                  print("Tom ERROR: Gemini retry budget exhausted and no ANTHROPIC_API_KEY configured — failing closed.", file=sys.stderr)
                  sys.exit(1)
              print("Tom: Gemini retry budget exhausted — attempting Claude fallback (single attempt).", file=sys.stderr)
              findings = call_claude_fallback(anthropic_key, system_prompt, user_content, requests)
              if findings is None:
                  print("Tom ERROR: Claude fallback also failed — failing closed (no third tier).", file=sys.stderr)
                  sys.exit(1)
              reviewer = "claude-fallback"

          # Validate shape
          for key in ("spec_conformance", "defects", "architecture_notes"):
            if key not in findings:
              findings[key] = []

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write("findings<<FINDINGS_EOF\n")
            f.write(json.dumps(findings, indent=2))
            f.write("\nFINDINGS_EOF\n")
            f.write(f"reviewer={reviewer}\n")

          # Determine verdict
          blocking_conformance = [x for x in findings["spec_conformance"] if x.get("severity") == "blocking"]
          blocking_defects = [x for x in findings["defects"] if x.get("severity") == "blocking"]
          has_blocking = bool(blocking_conformance or blocking_defects)

          # Spec-only diffs are always PASS — findings are advisory only, not merge-blockers.
          if artifact_type == "spec":
              has_blocking = False

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"verdict={'FAIL' if has_blocking else 'PASS'}\n")
            f.write(f"blocking_count={len(blocking_conformance) + len(blocking_defects)}\n")
            f.write(f"artifact_type={artifact_type}\n")

          print(f"Verdict: {'FAIL' if has_blocking else 'PASS'} ({reviewer}) — {len(blocking_defects)} blocking defect(s), {len(blocking_conformance)} blocking conformance deviation(s)")
          PYEOF

      - name: Write qa-findings artifact
        if: always()
        run: |
          mkdir -p /tmp/qa-artifacts
          cat > /tmp/qa-artifacts/qa-findings.json <<'EOF'
          ${{ steps.qa.outputs.findings || '{"error": "Tom did not produce findings"}' }}
          EOF

      - name: Upload qa-findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-findings
          path: /tmp/qa-artifacts/qa-findings.json
          retention-days: 30

      - name: Post PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FINDINGS: ${{ steps.qa.outputs.findings || '' }}
          VERDICT: ${{ steps.qa.outputs.verdict || 'ERROR' }}
          BLOCKING: ${{ steps.qa.outputs.blocking_count || '?' }}
          REVIEWER: ${{ steps.qa.outputs.reviewer || 'gemini' }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys

          verdict = os.environ.get("VERDICT", "ERROR")
          findings_raw = os.environ.get("FINDINGS", "")
          reviewer = os.environ.get("REVIEWER", "gemini")
          pr_number = "${{ inputs.pr_number }}"

          if not findings_raw:
            body = "## Tom QA — ERROR\n\nTom could not produce findings. This check is **red** by design (fail-closed). Investigate the workflow logs."
          else:
            try:
              findings = json.loads(findings_raw)
            except json.JSONDecodeError:
              body = f"## Tom QA — ERROR\n\nCould not parse Tom's response. Raw output:\n```\n{findings_raw[:1000]}\n```"
            else:
              emoji = "✅" if verdict == "PASS" else ("⏭️" if verdict == "SKIP" else "🚫")
              title_suffix = " (Claude fallback — Gemini unavailable)" if reviewer == "claude-fallback" else ""
              lines = [f"## Tom QA — {emoji} {verdict}{title_suffix}", ""]

              blocking_d = [x for x in findings.get("defects", []) if x.get("severity") == "blocking"]
              advisory_d = [x for x in findings.get("defects", []) if x.get("severity") != "blocking"]
              blocking_c = [x for x in findings.get("spec_conformance", []) if x.get("severity") == "blocking"]
              advisory_c = [x for x in findings.get("spec_conformance", []) if x.get("severity") != "blocking"]
              notes = findings.get("architecture_notes", [])

              if blocking_d or blocking_c:
                lines.append("### 🚫 Blocking (must fix before merge)")
                for x in blocking_c:
                  lines.append(f"- **[conformance]** {x.get('deviation', x)}")
                for x in blocking_d:
                  loc = x.get("location", "")
                  lines.append(f"- **[{x.get('type','defect')}]** {loc}: {x.get('description', x)}")
                lines.append("")

              if advisory_d or advisory_c:
                lines.append("### Advisory (backlog)")
                for x in advisory_c:
                  lines.append(f"- [conformance] {x.get('deviation', x)}")
                for x in advisory_d:
                  loc = x.get("location", "")
                  lines.append(f"- [{x.get('type','defect')}] {loc}: {x.get('description', x)}")
                lines.append("")

              if notes:
                lines.append("### Architecture notes")
                for n in notes:
                  lines.append(f"- {n}")
                lines.append("")

              lines.append("---")
              if reviewer == "claude-fallback":
                lines.append("*Reviewed by Tom's Claude fallback — Gemini's retry budget was exhausted (provider outage), so this run used the documented fallback path instead of the usual non-Claude decorrelation. See [DEV_LOOP_REFERENCE](docs/dev-loop/DEV_LOOP_REFERENCE.md) §3 invariant #4 and §8.5.*")
              else:
                lines.append("*Reviewed by Tom (Gemini) — non-Claude QA gate. See [DEV_LOOP_REFERENCE](docs/dev-loop/DEV_LOOP_REFERENCE.md) §8.5.*")
              body = "\n".join(lines)

          result = subprocess.run(
            ["gh", "pr", "comment", pr_number, "--body", body],
            capture_output=True, text=True
          )
          if result.returncode != 0:
            print(f"Warning: could not post PR comment: {result.stderr}", file=sys.stderr)
          PYEOF

      - name: Discord notification
        if: always()
        env:
          DISCORD_DEVLOOP_WEBHOOK: ${{ secrets.DISCORD_DEVLOOP_WEBHOOK }}
          VERDICT: ${{ steps.qa.outputs.verdict || 'ERROR' }}
          BLOCKING: ${{ steps.qa.outputs.blocking_count || '?' }}
          ARTIFACT_TYPE: ${{ steps.qa.outputs.artifact_type || 'code' }}
          FINDINGS: ${{ steps.qa.outputs.findings || '' }}
          REVIEWER: ${{ steps.qa.outputs.reviewer || 'gemini' }}
          PR_NUM: ${{ inputs.pr_number }}
          ITEM_ID: ${{ steps.spec.outputs.item_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/dev-loop/discord_notify.py

      - name: Fail on blocking issues or Tom error
        if: always()
        run: |
          VERDICT="${{ steps.qa.outputs.verdict }}"
          if [ -z "$VERDICT" ] || [ "$VERDICT" = "ERROR" ] || [ "$VERDICT" = "FAIL" ]; then
            echo "::error::Tom QA $VERDICT — merge blocked. See findings above."
            exit 1
          fi
