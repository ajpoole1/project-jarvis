services:
  # NOTE: the `openclaw` gateway service was REMOVED 2026-06-11 — it's a zombie here.
  # Jarvis's real gateway runs host-side as the systemd --user unit `openclaw-gateway.service`
  # (Discord + agent, off Docker). The container only restart-looped (same bot token → couldn't
  # connect). Backup: docker-compose.yml.bak-pre-zombie-2026-06-11. See workspace/gateway-off-docker-runbook.md.
  go2rtc:
    image: alexxit/go2rtc
    container_name: go2rtc
    restart: unless-stopped
    volumes:
      - ./config/personal/go2rtc.yaml:/config/go2rtc.yaml
    ports:
      - "1984:1984"
      - "8554:8554"

volumes:
  openclaw_state:
