services:
  openclaw:
    build: ./openclaw
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - OPENCLAW_STATE_DIR=/openclaw-state
      - OPENCLAW_CONFIG_PATH=/config/openclaw/openclaw.json
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./skills:/skills
      - ./config:/config
      - openclaw_state:/openclaw-state
    ports:
      - "18789:18789"

  go2rtc:
    image: alexxit/go2rtc
    container_name: go2rtc
    restart: unless-stopped
    volumes:
      - ./config/personal/go2rtc.yaml:/config/go2rtc.yaml
    ports:
      - "1984:1984"
      - "8554:8554"

volumes:
  openclaw_state:
